<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070d">
<title>黑夜君临 · 隐藏夜王推测器</title>
<style>
  :root{
    --serif: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Times New Roman", SimSun, "Songti SC", serif;
    --kai: KaiTi, "STKaiti", "Kaiti SC", Georgia, serif;
    --ink:#04060b; --panel-a:rgba(14,18,28,.86); --panel-b:rgba(7,10,17,.92);
    --gold:#e2c37a; --gold-bright:#f7e7b4; --gold-mid:#c9a44f; --gold-dim:rgba(226,195,122,.55);
    --line: rgba(226,195,122,.20); --line-soft: rgba(226,195,122,.12);
    --text:#e4e0d6; --muted:#b0ada1; --blood:#a04a3c; --good:#a8c98a; --bad:#d98a80;
  }
  *{box-sizing:border-box}
  html{background:var(--ink)}
  body{
    margin:0;color:var(--text);font-family:var(--serif);line-height:1.6;letter-spacing:.015em;
    padding:18px 14px 44px;-webkit-text-size-adjust:100%;position:relative;overflow-x:hidden;
    background:
      radial-gradient(1150px 680px at 80% -14%, rgba(96,128,178,.20), transparent 62%),
      radial-gradient(880px 520px at 10% 4%, rgba(78,64,120,.16), transparent 60%),
      radial-gradient(1400px 900px at 50% 118%, rgba(16,38,58,.26), transparent 66%),
      linear-gradient(180deg,#05070d 0%,#070a12 42%,#04060a 100%);
    background-attachment:fixed;
  }
  /* 夜空：月辉 + 星点 + 漂移夜雾 */
  .sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .sky::before{content:"";position:absolute;top:-190px;right:-120px;width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle,rgba(206,224,255,.15) 0%,rgba(150,175,225,.08) 38%,transparent 70%);
    filter:blur(6px)}
  .sky::after{content:"";position:absolute;inset:0;opacity:.5;
    background-image:
      radial-gradient(1.4px 1.4px at 12% 18%, rgba(255,255,255,.55), transparent),
      radial-gradient(1.2px 1.2px at 32% 8%, rgba(255,255,255,.35), transparent),
      radial-gradient(1.6px 1.6px at 68% 22%, rgba(255,255,255,.45), transparent),
      radial-gradient(1.1px 1.1px at 84% 12%, rgba(255,255,255,.3), transparent),
      radial-gradient(1.3px 1.3px at 52% 34%, rgba(255,255,255,.25), transparent),
      radial-gradient(1.2px 1.2px at 22% 46%, rgba(255,255,255,.22), transparent),
      radial-gradient(1.5px 1.5px at 92% 42%, rgba(255,255,255,.3), transparent);
    animation:twinkle 9s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.35}50%{opacity:.62}}
  .fog{position:fixed;inset:-10% -10% auto -10%;height:70%;pointer-events:none;z-index:0;filter:blur(52px);opacity:.5}
  .fog i{position:absolute;display:block;border-radius:50%;background:rgba(70,104,140,.20)}
  .fog i:nth-child(1){width:46%;height:60%;left:4%;top:10%;animation:drift1 46s ease-in-out infinite}
  .fog i:nth-child(2){width:38%;height:52%;right:6%;top:26%;background:rgba(120,96,150,.14);animation:drift2 58s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(6%,4%,0)}}
  @keyframes drift2{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-7%,-3%,0)}}
  /* 颗粒质感 */
  .grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.6'/></svg>")}
  /* 四边暗角 */
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(120% 90% at 50% 45%, transparent 52%, rgba(0,0,0,.55) 100%)}
  .wrap{position:relative;z-index:2;max-width:780px;margin:0 auto}

  header{text-align:center;margin-bottom:6px}
  h1{margin:0;font-size:26px;line-height:1.25;letter-spacing:.24em;font-weight:400;
    background:linear-gradient(180deg,#fbefc6 0%,#e2c37a 46%,#a8863c 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 20px rgba(226,195,122,.22))}
  .eyebrow{font-size:10.5px;letter-spacing:.34em;color:var(--gold-dim);margin:2px 0 8px}
  .tagline{font-family:var(--kai);font-size:12.5px;color:#b6b3a3;letter-spacing:.08em}
  .rule{display:flex;align-items:center;gap:11px;margin:12px 0 18px}
  .rule::before,.rule::after{content:"";flex:1;height:1px;
    background:linear-gradient(90deg,transparent,var(--line),transparent)}
  .rule b{width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--gold-dim);
    background:rgba(226,195,122,.16);box-shadow:0 0 10px rgba(226,195,122,.3)}

  .card{position:relative;margin-bottom:15px;padding:15px 16px;
    background:linear-gradient(180deg,var(--panel-a),var(--panel-b));
    border:1px solid var(--line-soft);border-radius:3px;
    box-shadow:0 12px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.035)}
  .card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:3px;
    background:
      linear-gradient(var(--gold-dim),var(--gold-dim)) 0 0/15px 1px no-repeat,
      linear-gradient(var(--gold-dim),var(--gold-dim)) 0 0/1px 15px no-repeat,
      linear-gradient(var(--gold-dim),var(--gold-dim)) 100% 100%/15px 1px no-repeat,
      linear-gradient(var(--gold-dim),var(--gold-dim)) 100% 100%/1px 15px no-repeat;
    opacity:.75}

  label{display:block;font-size:10.5px;letter-spacing:.22em;color:rgba(226,195,122,.78);margin-bottom:7px}
  select{width:100%;appearance:none;background-color:rgba(18,23,35,.96);color:#f2eee4;
    border:1px solid rgba(226,195,122,.30);border-radius:2px;padding:11px 34px 11px 15px;font-size:14.5px;font-family:inherit;
    letter-spacing:.03em;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14'><path d='M7 2.2 L11.8 7 L7 11.8 L2.2 7 Z' fill='none' stroke='%23d8b872' stroke-width='1.2'/><circle cx='7' cy='7' r='1' fill='%23d8b872'/></svg>"),
      linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,.015) 60%, rgba(0,0,0,.18));
    background-repeat:no-repeat,no-repeat;
    background-position:right 12px center, 0 0;
    background-size:auto,100% 100%;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05), inset 0 -8px 20px rgba(0,0,0,.55), 0 1px 6px rgba(0,0,0,.5)}
  select:hover{border-color:rgba(226,195,122,.45)}
  select:focus{outline:none;border-color:var(--gold-dim);box-shadow:0 0 0 1px rgba(226,195,122,.2), inset 0 0 20px rgba(226,195,122,.07)}
  select option{background:#0a0d16;color:var(--text)}
  .grid{display:grid;grid-template-columns:1fr;gap:11px}
  @media(min-width:600px){.grid{grid-template-columns:1fr 1fr}}
  .grid3{display:grid;grid-template-columns:1fr;gap:11px;margin-top:11px}
  @media(min-width:600px){.grid3{grid-template-columns:1fr 1fr}}
  .hint{font-family:var(--kai);font-size:12.5px;color:#aaa79b;margin-top:10px;line-height:1.75;letter-spacing:.02em}

  .res-head{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.24em;
    color:var(--gold-dim);margin:0 0 11px}
  .res-head::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-soft),transparent)}
  .locked{color:var(--gold-bright);text-shadow:0 0 14px rgba(226,195,122,.35)}

  .boss{position:relative;margin-bottom:11px;padding:14px 15px;
    background:linear-gradient(180deg,rgba(16,20,31,.9),rgba(8,11,19,.94));
    border:1px solid var(--line-soft);border-left:2px solid rgba(226,195,122,.34);border-radius:2px;
    box-shadow:0 10px 26px rgba(0,0,0,.45)}
  .boss.lock{border-color:rgba(226,195,122,.5);border-left-color:var(--gold-mid);
    box-shadow:0 0 0 1px rgba(226,195,122,.12), 0 0 30px rgba(226,195,122,.10), inset 0 0 34px rgba(226,195,122,.05)}
  .boss-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .boss-name{font-size:17px;letter-spacing:.08em;color:var(--gold-bright)}
  .boss-name::before{content:"\25C6";font-size:.55em;color:var(--gold-dim);margin-right:8px;vertical-align:.18em}
  .boss-sub{font-size:12px;color:#b6b3a7;letter-spacing:.08em;margin-top:2px;padding-left:19px}
  .boss-pct{font-size:20px;letter-spacing:.06em;color:var(--gold);white-space:nowrap;
    text-shadow:0 0 16px rgba(226,195,122,.28)}
  .weak{font-size:12.5px;margin-top:9px}
  .weak b{color:var(--gold);font-weight:400}
  .bar{height:11px;margin-top:12px;background:#241812;border:1px solid rgba(226,195,122,.32);
    border-radius:1px;overflow:hidden;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.85), 0 0 0 1px rgba(0,0,0,.45), 0 0 12px rgba(226,195,122,.06)}
  .bar>i{display:block;height:100%;border-radius:0 2px 2px 0;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.11) 0 1px, rgba(255,255,255,0) 1px 7px),
      linear-gradient(180deg,#f2dda5 0%,#d8b872 26%,#b98f38 56%,#6d4d16 100%);
    box-shadow:0 0 18px rgba(226,195,122,.45), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(0,0,0,.4)}
  .chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .chip{font-size:11px;letter-spacing:.1em;color:#c9c5b8;
    background:linear-gradient(90deg, rgba(226,195,122,.10), rgba(226,195,122,.015));
    border:none;border-left:1px solid rgba(226,195,122,.5);border-radius:0;padding:4px 10px 4px 9px}
  .chip b{color:#f0ece2;font-weight:400;font-family:"Segoe UI",system-ui,sans-serif;font-size:11.5px;letter-spacing:0}

  .note{position:relative;font-size:12.5px;padding:10px 12px;margin-bottom:10px;border-radius:2px;
    background:rgba(8,11,18,.8);border:1px solid var(--line-soft);border-left:2px solid var(--gold-dim)}
  .note.warn{border-left-color:var(--gold-mid);color:#e6d3ab;background:rgba(30,24,12,.5)}
  .note.bad{border-left-color:var(--blood);color:#edbfb7;background:rgba(34,14,12,.5)}
  .note.ok{border-left-color:var(--good);color:#cfe3bb;background:rgba(14,26,14,.5)}
  .empty{font-family:var(--kai);font-size:13.5px;color:#b0ada1;text-align:center;padding:18px 4px;letter-spacing:.1em}
  .empty::before{content:"\2756";display:block;color:var(--gold-dim);margin-bottom:8px;font-size:14px}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid rgba(226,195,122,.09);vertical-align:top}
  th{color:var(--gold-dim);font-weight:400;font-size:11px;letter-spacing:.14em}
  tbody tr:nth-child(even) td{background:rgba(255,255,255,.022)}
  tbody tr:hover td{background:rgba(226,195,122,.05)}
  tr:last-child td{border-bottom:none}
  details summary{list-style:none;cursor:pointer;font-size:12.5px;letter-spacing:.14em;color:var(--gold);outline:none;
    padding:7px 10px;margin:-7px -10px;border:1px solid transparent;border-radius:2px;transition:border-color .18s,background .18s}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"\25C7";color:var(--gold-dim);margin-right:9px;letter-spacing:0;transition:color .18s}
  details[open] summary::before{content:"\25C6";color:var(--gold)}
  details summary:hover{color:var(--gold-bright);border-color:var(--line);background:rgba(226,195,122,.05)}
  details summary:hover::before{color:var(--gold)}
  details[open] summary{margin-bottom:4px}
  .prep{font-size:13.5px;line-height:1.9}
  .prep em{font-style:normal;color:var(--gold)}
  .foot{font-family:var(--kai);font-size:12px;color:#bcb9ab;line-height:1.9;letter-spacing:.03em;text-align:center;margin-top:22px}
  .foot::before{content:"\2756";display:block;color:var(--gold-dim);margin-bottom:9px;opacity:.7}
  @media (prefers-reduced-motion: reduce){.sky::after,.fog i{animation:none !important}}
</style>
</head>
<body>
<div class="sky"></div>
<div class="fog"><i></i><i></i></div>
<div class="grain"></div>
<div class="vignette"></div>

<div class="wrap">
  <header>
    <div class="eyebrow">ELDEN RING&nbsp;NIGHTREIGN</div>
    <h1>隐藏夜王推测器</h1>
    <div class="rule"><b></b></div>
    <div class="tagline">深き夜 · 深夜模式　|　从第 1 / 2 夜 BOSS 推测第 3 天夜王</div>
  </header>

  <div class="card">
    <div class="grid">
      <div>
        <label>第 1 夜 BOSS</label>
        <select id="n1"></select>
      </div>
      <div>
        <label>第 2 夜 BOSS</label>
        <select id="n2"></select>
      </div>
    </div>
    <div class="grid3">
      <div>
        <label>当前深度</label>
        <select id="depth">
          <option value="3" selected>深度 3</option>
          <option value="4">深度 4</option>
          <option value="5">深度 5</option>
          <option value="any">不确定</option>
        </select>
      </div>
    </div>
    <div class="hint">两个下拉都可以先选。带「⚠ 与对方无共同夜王」的选项仍然可选 —— 那种情况通常意味着第 2 夜打的是追加/突袭 BOSS。第 2 夜还没打可以留空。</div>
  </div>

  <div id="out" class="res"></div>

  <div class="card" style="padding:11px 15px">
    <details>
      <summary>完整对照表　BOSS → 可能夜王</summary>
      <div id="tbl" style="margin-top:9px"></div>
    </details>
  </div>

  <div class="foot">
    数据：nightlord.app 内嵌数据集（社区数据表 + 数据挖掘），已与日文 jbjbgame / gamewith、中文游民星空两张表交叉验证。概率为候选间归一化的相对值，非官方数值。<br>
    布德奇冥无永夜版本，且池子覆盖几乎全部 BOSS，永远是兜底候选。
  </div>
</div>

<script>
const DB = {"nightlords": {"gladius": {"cn": "格拉狄乌斯", "sub": "三头野兽 / 黑夜野兽", "en": "Gladius", "weak": ["圣"]}, "adel": {"cn": "艾德雷", "sub": "碎身巨颚 / 黑夜之爵", "en": "Adel", "weak": ["中毒", "冻伤"]}, "gnoster": {"cn": "格诺斯塔", "sub": "慧心虫 / 黑夜之智", "en": "Gnoster", "weak": ["火"]}, "maris": {"cn": "玛利斯", "sub": "征兆 / 深海黑夜", "en": "Maris", "weak": ["雷"]}, "libra": {"cn": "利普拉", "sub": "平衡律法的魔物 / 黑夜之魔", "en": "Libra", "weak": ["圣", "火", "发狂"]}, "fulghor": {"cn": "弗格尔", "sub": "暗中飞驰的猎人 / 黑夜光骑士", "en": "Fulghor", "weak": ["雷", "出血"]}, "caligo": {"cn": "卡莉果", "sub": "雾中裂缝 / 黑夜雾霾", "en": "Caligo", "weak": ["火", "出血"]}, "heolstor": {"cn": "布德奇冥", "sub": "黑夜化形者 / 黑夜王", "en": "Heolstor", "weak": ["圣(一阶段)", "雷(二阶段)"], "everdark": false}, "balancers": {"cn": "哈尔莫妮亚", "sub": "安定者们", "en": "Harmonia", "weak": ["睡眠(官方)/高伤AOE与盾反(实际)"]}, "dreglord": {"cn": "史柴格斯", "sub": "废弃物之王", "en": "Straghess", "weak": ["神圣(-25%抗)", "火焰(-20%抗)", "出血/冻伤(低抗)"], "everdark": false}}, "prior": {"gladius": 10.08, "adel": 10.08, "gnoster": 10.08, "maris": 5.04, "libra": 10.08, "fulghor": 10.08, "caligo": 10.08, "heolstor": 7.06, "dreglord": 11.29, "balancers": 16.13}, "everdark_chance": {"1": 0.0, "2": 0.2, "3": 0.35, "4": 0.5, "5": 0.5}, "n1": [{"name": "亚人女王&亚人剑圣", "nightlords": ["gladius", "heolstor"], "alias": ["亚人女王+亚人剑圣", "亚人女王", "demi", "Demi-Human Queen & Swordmaster"]}, {"name": "铃珠猎人", "nightlords": ["gladius", "caligo", "heolstor"], "alias": ["bbh", "Bell Bearing Hunter", "铃玉狩り", "铃珠"]}, {"name": "百足恶魔", "nightlords": ["gnoster", "libra", "fulghor", "heolstor"], "alias": ["centipede", "Centipede Demon"]}, {"name": "战场老将", "nightlords": ["gnoster", "libra", "heolstor"], "alias": ["battlefield", "Battlefield Commander"]}, {"name": "熔铁恶魔", "nightlords": ["gnoster", "maris", "caligo", "heolstor"], "alias": ["smelter", "Smelter Demon"]}, {"name": "双黑夜骑兵", "nightlords": ["adel", "fulghor", "heolstor"], "alias": ["cavalry", "Night's Cavalry Duo", "黑夜骑兵"]}, {"name": "英雄石像鬼", "nightlords": ["adel", "maris", "fulghor", "heolstor"], "alias": ["gargoyle", "Valiant Gargoyle", "石像鬼"]}, {"name": "蚯蚓脸", "nightlords": ["adel", "maris", "fulghor", "heolstor"], "alias": ["wormface", "Wormface", "蚯蚓头"]}, {"name": "公爵的弗雷迪亚", "nightlords": ["adel", "libra", "caligo", "heolstor"], "alias": ["freja", "The Duke's Dear Freja", "弗雷迪亚"]}, {"name": "贪食魔龙", "nightlords": ["adel", "maris", "fulghor", "heolstor"], "alias": ["gaping", "Gaping Dragon"]}, {"name": "提比亚的唤声船", "nightlords": ["gnoster", "libra", "caligo", "heolstor"], "alias": ["tibia", "Tibia Mariner", "唤声船"]}, {"name": "腐烂树灵", "nightlords": ["gnoster", "caligo", "heolstor"], "alias": ["tree", "Ulcerated Tree Spirit", "树灵"]}, {"name": "接肢君王", "nightlords": ["maris", "caligo", "heolstor"], "alias": ["grafted", "Grafted Monarch", "接肢"]}, {"name": "王室幽魂", "nightlords": ["libra", "fulghor", "heolstor"], "alias": ["revenant", "Royal Revenant", "幽魂"]}, {"name": "死骑士", "nightlords": ["dreglord"], "alias": ["deathknight", "Death Knight"]}, {"name": "负伤恶魔&洞底恶魔", "nightlords": ["balancers"], "alias": ["demons", "Demon in Pain & Demon from Below", "负伤恶魔"]}, {"name": "神兽战士&咒剑士", "nightlords": ["balancers"], "alias": ["warrior", "Divine Beast Warrior & Curseblade", "神兽战士"]}, {"name": "大红熊", "nightlords": ["dreglord"], "alias": ["bear", "Great Red Bear", "大赤熊", "赤熊"]}], "n2": [{"name": "古龙", "nightlords": ["adel", "heolstor"], "alias": ["ancient", "Ancient Dragon"]}, {"name": "熔炉骑士&黄金河马", "nightlords": ["adel", "libra", "heolstor"], "alias": ["crucible", "Crucible Knight & Golden Hippopotamus", "熔炉骑士"]}, {"name": "冷冽谷的舞娘", "nightlords": ["caligo", "heolstor"], "alias": ["dancer", "Dancer of the Boreal Valley", "舞娘"]}, {"name": "死亡仪式鸟", "nightlords": ["libra", "heolstor"], "alias": ["deathrite", "Death Rite Bird", "仪式鸟"]}, {"name": "龙装大树守卫&王城骑兵", "nightlords": ["gnoster", "caligo", "heolstor"], "alias": ["draconic", "Draconic Tree Sentinel & Royal Cavalrymen", "龙装大树守卫"]}, {"name": "坠星成兽", "nightlords": ["maris", "heolstor"], "alias": ["fallingstar", "Full-Grown Fallingstar Beast", "坠星"]}, {"name": "恶兆妖鬼", "nightlords": ["gladius", "fulghor", "heolstor"], "alias": ["fell", "Fell Omen", "恶兆"]}, {"name": "神皮贵族&神皮使徒", "nightlords": ["maris", "libra", "caligo", "heolstor"], "alias": ["godskin", "Godskin Duo", "神皮"]}, {"name": "大土龙", "nightlords": ["gnoster", "heolstor"], "alias": ["wyrm", "Great Wyrm", "土龙"]}, {"name": "无名王者", "nightlords": ["fulghor", "heolstor"], "alias": ["nameless", "Nameless King"]}, {"name": "诺克斯龙人士兵", "nightlords": ["gnoster", "fulghor", "heolstor"], "alias": ["nox", "Nox Dragonkin Soldier", "龙人士兵"]}, {"name": "外域老将", "nightlords": ["adel", "fulghor", "heolstor"], "alias": ["outland", "Outland Commander", "僻地老将", "偏地老将"]}, {"name": "大树守卫&王城骑兵", "nightlords": ["gladius", "gnoster", "maris", "heolstor"], "alias": ["treesent", "Tree Sentinel & Royal Cavalrymen", "大树守卫"]}, {"name": "骑士亚尔特留斯", "nightlords": ["dreglord"], "alias": ["artorias", "Knight Artorias", "亚尔特留斯"]}, {"name": "神兽舞狮", "nightlords": ["dreglord"], "alias": ["lion", "Divine Beast Dancing Lion", "舞狮"]}, {"name": "鲜血君王", "nightlords": ["balancers"], "alias": ["mohg", "Lord of Blood", "血之君王"]}, {"name": "恶魔王子", "nightlords": ["balancers"], "alias": ["demonprince", "Demon Prince"]}], "everdark_tells": {"adel": {"1": ["双黑夜骑兵"]}, "gnoster": {"1": ["提比亚的唤声船"]}, "fulghor": {"1": ["蚯蚓脸"]}, "caligo": {"1": ["公爵的弗雷迪亚", "提比亚的唤声船"], "2": ["神皮贵族&神皮使徒"]}, "libra": {"1": ["战场老将"], "2": ["神皮贵族&神皮使徒"]}}, "low_confidence": [["铃珠猎人", "caligo"]]}
;
const NL = DB.nightlords, PRIOR = DB.prior, EDCH = DB.everdark_chance;
const LOWCONF = new Set((DB.low_confidence||[]).map(p => p[0]+"|"+p[1]));
const TELLS = DB.everdark_tells || {};

function pool(list, name){ const r = list.find(x => x.name === name); return r ? r.nightlords : []; }
function cn(k){ return NL[k].cn; }
function hasED(k){ return NL[k].everdark !== false; }

const n1Sel = document.getElementById('n1'), n2Sel = document.getElementById('n2'), dSel = document.getElementById('depth');
const OPT1 = DB.n1.map(b => ({v:b.name, pool:b.nightlords}));
const OPT2 = DB.n2.map(b => ({v:b.name, pool:b.nightlords}));

function fill(sel, opts, valid, ph){
  const prev = sel.value;
  sel.innerHTML = '';
  const o0 = document.createElement('option'); o0.value=''; o0.textContent = ph; sel.appendChild(o0);
  opts.forEach(o => {
    const bad = valid && !valid.has(o.v);
    const el = document.createElement('option'); el.value = o.v;
    el.textContent = o.v + (bad ? '\u00a0\u00a0⚠ 与对方无共同夜王' : '');
    sel.appendChild(el);
  });
  if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev; else sel.value = '';
}

function compatN2(n1v){
  if (!n1v) return null;
  const a = new Set(pool(DB.n1, n1v)), ok = new Set();
  OPT2.forEach(o => { if (o.pool.some(k => a.has(k))) ok.add(o.v); });
  return ok;
}
function compatN1(n2v){
  if (!n2v) return null;
  const b = new Set(pool(DB.n2, n2v)), ok = new Set();
  OPT1.forEach(o => { if (o.pool.some(k => b.has(k))) ok.add(o.v); });
  return ok;
}

function calc(){
  const n1 = n1Sel.value, n2 = n2Sel.value, dep = dSel.value;
  const out = document.getElementById('out');
  let cands = Object.keys(PRIOR);
  if (n1) cands = cands.filter(k => pool(DB.n1, n1).includes(k));
  if (n2) cands = cands.filter(k => pool(DB.n2, n2).includes(k));
  const total = cands.reduce((s,k) => s + PRIOR[k], 0);

  let h = '';
  if (!n1 && !n2){
    out.innerHTML = '<div class="card"><div class="empty">选择第 1 夜 BOSS，揭示可能的夜王。</div></div>';
    return;
  }
  if (!cands.length){
    out.innerHTML = '<div class="card"><div class="note bad">这两个 BOSS 在数据里没有共同夜王。优先怀疑第 2 夜是追加/突袭 BOSS（surprise followup），用第 1 夜单条推。</div></div>';
    return;
  }
  const rows = cands.map(k => ({k, pct: PRIOR[k]/total*100})).sort((a,b) => b.pct - a.pct);
  const locked = rows.length === 1 || Math.abs(rows[0].pct - 100) < 0.1;
  const max = rows[0].pct;

  // 常夜专属池：只对真正匹配的那个候选标出来，不笼统下结论
  rows.forEach(r => {
    const t = TELLS[r.k]; if (!t) return;
    [[1,n1],[2,n2]].forEach(([night, seen]) => {
      if (seen && t[night] && t[night].includes(seen)){
        if (rows.length === 1)
          h += '<div class="note ok">常夜锁定：第 '+night+' 夜「'+seen+'」只在'+cn(r.k)+'的永夜池里 ⇒ 这局必定是永夜版本。</div>';
        r._ed = true;
      }
    });
  });

  const ed = dep === 'any' ? null : EDCH[dep];
  h += '<div class="res-head">' + (locked ? '<span class="locked">锁 定</span> · 唯一可能' : '可能夜王 · '+rows.length+' 个候选') + '</div>';

  rows.forEach(r => {
    const n = NL[r.k];
    const showED = ed !== null && hasED(r.k) && ed > 0;
    h += '<div class="boss'+(locked?' lock':'')+'">';
    h += '<div class="boss-top"><div><div class="boss-name">'+n.cn+'</div><div class="boss-sub">'+n.sub+'</div></div>';
    h += '<div class="boss-pct">'+r.pct.toFixed(1)+'%</div></div>';
    h += '<div class="weak">弱点 / 准备：<b>'+n.weak.join('、')+'</b></div>';
    if (showED && !r._ed){
      h += '<div class="chips"><span class="chip">常规 <b>'+(r.pct*(1-ed)).toFixed(1)+'%</b></span>'
         + '<span class="chip">永夜 <b>'+(r.pct*ed).toFixed(1)+'%</b></span></div>';
    } else if (r._ed){
      h += '<div class="chips"><span class="chip">永夜 <b>'+r.pct.toFixed(1)+'%</b></span><span class="chip">常规 <b>0%</b></span></div>';
    } else if (hasED(r.k) === false){
      h += '<div class="chips"><span class="chip">无永夜版本</span></div>';
    }
    if (r._ed){
      h += '<div class="chips"><span class="chip" style="border-color:rgba(168,201,138,.45);color:#cfe3bb">永夜专属池 · 看见的那个 BOSS 常规池里没有</span></div>';
    }
    h += '<div class="bar"><i style="width:'+(r.pct/max*100).toFixed(1)+'%"></i></div></div>';
    if (LOWCONF.has((n1||'')+'|'+r.k) || LOWCONF.has((n2||'')+'|'+r.k))
      h += '<div class="note warn">注：这个配对只有单一数据源收录，置信度较低（日文/中文攻略表未列入）。</div>';
  });

  const cnt = {};
  rows.forEach(r => new Set(NL[r.k].weak.map(w => w.split('(')[0])).forEach(w => cnt[w] = (cnt[w]||0)+1));
  const order = Object.keys(cnt).sort((a,b) => cnt[b]-cnt[a]);
  h += '<div class="card"><div class="res-head">准备方向</div><div class="prep">'
     + order.map(w => '<em>'+w+'</em>' + (cnt[w] > 1 ? ' <span style="color:var(--muted);font-size:11px">×'+cnt[w]+'</span>' : '')).join(' &nbsp;·&nbsp; ')
     + '</div><div class="hint">×N 表示有 N 个候选吃这个属性，优先级更高。泛用起手：雷或圣。</div></div>';

  out.innerHTML = h;
}

function buildTable(){
  let h = '<table><tr><th style="width:34%">第 1 夜</th><th>可能夜王</th></tr>';
  DB.n1.forEach(b => h += '<tr><td>'+b.name+'</td><td>'+b.nightlords.map(cn).join('、')+'</td></tr>');
  h += '<tr><th>第 2 夜</th><th>可能夜王</th></tr>';
  DB.n2.forEach(b => h += '<tr><td>'+b.name+'</td><td>'+b.nightlords.map(cn).join('、')+'</td></tr>');
  h += '</table>';
  document.getElementById('tbl').innerHTML = h;
}

n1Sel.addEventListener('change', () => { fill(n2Sel, OPT2, compatN2(n1Sel.value), '未打 / 不确定'); calc(); });
n2Sel.addEventListener('change', () => { fill(n1Sel, OPT1, compatN1(n2Sel.value), '未打 / 不确定'); calc(); });
dSel.addEventListener('change', calc);

fill(n1Sel, OPT1, null, '未打 / 不确定');
fill(n2Sel, OPT2, null, '未打 / 不确定');
buildTable();
calc();
</script>
